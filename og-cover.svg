  <line x1="1120" y1="0" x2="1120" y2="630" stroke="#27272A" stroke-width="1"/>
  <line x1="0" y1="88" x2="1200" y2="88" stroke="#27272A" stroke-width="1"/>
  <line x1="0" y1="542" x2="1200" y2="542" stroke="#27272A" stroke-width="1"/>

  <!-- Top Accent Bar -->

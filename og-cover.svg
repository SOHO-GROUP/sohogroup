<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowStrategies" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSolutions" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dualAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#17C3E6"/>

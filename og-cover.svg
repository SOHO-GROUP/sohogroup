  <!-- Official SOHO | GROUP Hexagonal Emblem (White Plate) -->
  <rect x="130" y="140" width="220" height="220" rx="20" fill="#FFFFFF" stroke="#27272A" stroke-width="2"/>
  <g transform="translate(130, 140) scale(0.44)">
    <polyline points="106,170 106,137 250,54 394,137 394,170" fill="none" stroke="#0047AB" stroke-width="8" stroke-miterlimit="10"/>
    <polyline points="106,268 106,301 250,384 394,301 394,268" fill="none" stroke="#0047AB" stroke-width="8" stroke-miterlimit="10"/>
    <polygon points="136,148 250,80 372,150 372,193 250,123 172,169" fill="#000000"/>
    <polygon points="364,290 250,358 128,288 128,245 250,315 328,269" fill="#53626A"/>
    <polygon points="180,183 250,142 372,212 372,284 334,262 332,232 250,184 202,212 180,199" fill="#17C3E6"/>
    <polygon points="320,255 250,296 128,226 128,154 166,176 168,206 250,254 298,226 320,239" fill="#D9231B"/>
    <polygon points="250,191 274,219 250,247 226,219" fill="#FF9947"/>
    <text x="163" y="445" fill="#53626A" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="7" text-anchor="middle">SOHO</text>
    <line x1="250" y1="403" x2="250" y2="452" stroke="#0047AB" stroke-width="6.5"/>
    <text x="348" y="445" fill="#53626A" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="2" text-anchor="middle">GROUP</text>
  </g>

  <!-- Right Editorial Column -->
  <text x="395" y="168" fill="#A1A1AA" font-family="monospace" font-size="14" letter-spacing="4">01 // HOLDING EMPRESARIAL DUAL</text>
  <text x="395" y="235" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="54" font-weight="800" letter-spacing="6">SOHO GROUP</text>
  <text x="395" y="285" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="600">Sinergia, disrupción y resultados:</text>
  <text x="395" y="318" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="20">El equilibrio perfecto entre crecimiento y blindaje corporativo.</text>

  <!-- Dual Gateway Division Badges -->

  </defs>

  <!-- Base Carbon Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#glowStrategies)"/>
  <rect width="1200" height="630" fill="url(#glowSolutions)"/>

  <!-- Editorial Grid Hairlines (June 15 / Over J Style) -->
